<article class="post-card">
  <a href="{{ .Permalink }}">
    {{ with .Params.image }}
    <div class="post-card-media">
      <img src="{{ . }}" alt="" aria-hidden="true" loading="lazy" decoding="async">
    </div>
    {{ end }}
    <div class="post-card-body">
      <span class="post-card-date">{{ .Date.Format "02.01.2006" }}</span>
      <h3 class="post-card-title">{{ .Title }}</h3>
      <p class="post-card-text">{{ .Summary | plainify }}</p>
    </div>
  </a>
  {{ with .GetTerms "tags" }}
  <div class="post-card-tags">
    {{ range . }}
    <a class="tag-pill" href="{{ .Permalink }}">#{{ .LinkTitle }}</a>
    {{ end }}
  </div>
  {{ end }}
</article>
