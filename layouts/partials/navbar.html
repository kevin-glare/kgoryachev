<nav id="navbar" class="navbar navbar-expand-lg fixed-top site-nav">
  <div class="container">
    <a class="d-flex align-items-center gap-2 text-decoration-none" href="/" aria-label="КГ Константин Горячев — на главную">
      <span class="brand-mark" aria-hidden="true">КГ</span>
      <span class="brand-name d-none d-sm-inline">Константин Горячев</span>
    </a>
    <button class="navbar-toggler ms-auto" type="button"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Открыть меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link{{ if .IsHome }} active{{ end }}"{{ if .IsHome }} aria-current="page"{{ end }} href="/">Главная</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/#about">Обо мне</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/#experience">Опыт</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/#projects">Проекты</a>
        </li>
        <li class="nav-item">
          <a class="nav-link{{ if eq .Type `posts` }} active{{ end }}"{{ if eq .Type `posts` }} aria-current="page"{{ end }} href="/posts">Статьи</a>
        </li>
        <li class="nav-item">
          <a class="nav-link{{ if eq .Type `news` }} active{{ end }}"{{ if eq .Type `news` }} aria-current="page"{{ end }} href="/news">Новости</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<script>
  // Бургер вместо bootstrap.bundle: переключаем .show и aria вручную.
  // Пункт меню или Escape — закрыть; анимации нет, только вход/выход.
  (function () {
    var btn = document.querySelector('.navbar-toggler');
    var menu = document.getElementById('navbarSupportedContent');
    if (!btn || !menu) return;
    var setOpen = function (open) {
      menu.classList.toggle('show', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', open ? 'Закрыть меню' : 'Открыть меню');
    };
    btn.addEventListener('click', function () {
      setOpen(!menu.classList.contains('show'));
    });
    menu.addEventListener('click', function (e) {
      if (e.target.closest('a')) setOpen(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && menu.classList.contains('show')) {
        setOpen(false);
        btn.focus();
      }
    });
  })();
</script>
