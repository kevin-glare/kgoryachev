<header class="site-header" id="siteHeader">
  <div class="container nav-row">
    <a class="brand" href="/">
      <img class="brand-logo" src="/images/base/g-ink.png" alt="" aria-hidden="true" width="28" height="28">
      kgoryachev<span class="brand-dot">.ru</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="siteNav" aria-label="Открыть меню">
      <span></span>
      <span></span>
    </button>
    <nav class="site-nav" id="siteNav">
      <a class="nav-link{{ if .IsHome }} active{{ end }}"{{ if .IsHome }} aria-current="page"{{ end }} href="/">Главная</a>
      <a class="nav-link" href="/#about">Обо мне</a>
      <a class="nav-link" href="/#projects">Проекты</a>
      <a class="nav-link{{ if eq .Type `posts` }} active{{ end }}"{{ if eq .Type `posts` }} aria-current="page"{{ end }} href="/posts">Статьи</a>
      <a class="nav-link{{ if eq .Type `news` }} active{{ end }}"{{ if eq .Type `news` }} aria-current="page"{{ end }} href="/news">Новости</a>
      <div class="nav-actions">
        <a class="icon-btn" href="https://t.me/kgoryachev" target="_blank" rel="noopener" aria-label="Telegram"
          title="Telegram">
          <img src="/images/base/tg.svg" class="icon" alt="" aria-hidden="true"></a>
        <a class="icon-btn" href="mailto:kevin.glare@gmail.com" aria-label="Почта" title="Почта">
          <img src="/images/base/mail.svg" class="icon" alt="" aria-hidden="true">
        </a>
        <a class="icon-btn" href="https://github.com/kevin-glare" target="_blank" rel="noopener" aria-label="GitHub"
          title="GitHub">
          <img src="/images/base/gh.svg" class="icon" alt="" aria-hidden="true">
        </a>
      </div>
    </nav>
  </div>
</header>
