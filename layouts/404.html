{{ define "main" }}
<div class="container error-page">
  <div class="error-code" aria-hidden="true">404</div>
  <h1>Страница не найдена</h1>
  <p>Похоже, такой страницы больше нет. Возможно, она переехала.</p>
  <a class="btn btn-accent" href="/">Вернуться на главную</a>
</div>

<script>
  // Теги переехали с /tags/<slug>/ на /posts/tags/<slug>/.
  // GitHub Pages не умеет серверные редиректы, поэтому перенаправляем со страницы 404.
  (function () {
    if (/\.(xml|rss|txt|json)$/.test(window.location.pathname)) return;
    var m = window.location.pathname.match(/^\/tags\/(?:index\.html)?(.*)$/);
    if (m) {
      window.location.replace(m[1] ? '/posts/tags/' + m[1] : '/posts/');
    }
  })();
</script>
{{ end }}
