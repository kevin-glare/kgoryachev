{{ define "main" }}
<div id="content" class="error-page">
  <div class="container">
    <p class="error-code mb-2">404 · страница не найдена</p>
    <h1>Такой страницы нет</h1>
    <p class="text-secondary">Возможно, страница переехала. Вернитесь на главную или загляните <a href="/posts/">в статьи</a>.</p>
    <a class="btn-hero primary mt-3" href="/">На главную</a>
  </div>
</div>

<script>
  // Теги переехали с /tags/<slug>/ на /posts/tags/<slug>/.
  // GitHub Pages не умеет серверные редиректы, поэтому перенаправляем со страницы 404.
  (function () {
    if (/\.(xml|rss|txt|json)$/.test(window.location.pathname)) return;
    var m = window.location.pathname.match(/^\/tags\/(?:index\.html)?(.*)$/);
    if (m) {
      window.location.replace(m[1] ? '/posts/tags/' + m[1] : '/posts/');
    }
  })();
</script>
{{ end }}
