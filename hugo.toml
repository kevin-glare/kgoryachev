baseURL = 'https://kgoryachev.ru'
locale = 'ru-RU'
languageName = 'Русский'
title = 'Константин Горячев'

enableRobotsTXT = true
enableGitInfo = true

# Страницу-список всех тегов (/tags/) не генерируем — теги доступны из облака
disableKinds = ['taxonomy']

[pagination]
  pagerSize = 9

# Похожие статьи: индекс по тегам
[related]
  includeNewer = true
  threshold = 0
  toLower = false
[[related.indices]]
  name = 'tags'
  weight = 100

# Используем только теги: пустая таксономия categories больше не генерируется
[taxonomies]
  tag = 'tags'

# Страницы тегов живут внутри раздела статей: /posts/tags/<slug>/
[permalinks]
  tags = '/posts/tags/:slug/'

[params]
  author = 'Константин Горячев'
  description = 'Руководитель группы разработки / Tech Lead. 10+ лет в разработке, 5+ лет руковожу командами. Проекты, опыт и статьи о разработке.'
  telegram = 'https://t.me/kevinglare'
  github = 'https://github.com/kevin-glare'
  email = 'kevinglare@yandex.ru'
  ogImage = '/images/base/og-cover.png'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'github'

[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'

[caches]
  [caches.assets]
    dir = ':resourceDir/_gen'
    maxAge = -1
  [caches.images]
    dir = ':resourceDir/_gen'
    maxAge = -1
