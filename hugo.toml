baseURL = 'https://kgoryachev.ru'
locale = 'ru-RU'
languageName = 'Русский'
title = 'Константин Горячев'

enableRobotsTXT = true
enableGitInfo = true

# Страницу-список всех тегов (/tags/) не генерируем — теги доступны из облака
disableKinds = ['taxonomy']

[pagination]
  pagerSize = 9

# Похожие статьи: индекс по тегам
[related]
  includeNewer = true
  threshold = 0
  toLower = false
[[related.indices]]
  name = 'tags'
  weight = 100

# Используем только теги: пустая таксономия categories больше не генерируется
[taxonomies]
  tag = 'tags'

# Страницы тегов живут внутри раздела статей: /posts/tags/<slug>/
[permalinks]
  tags = '/posts/tags/:slug/'

[params]
  author = 'Константин Горячев'
  # Годы для описания сайта считаются от этих точек (как в hero-панели)
  career_since = 2016
  leading_since = 2021
  telegram = 'https://t.me/kevinglare'
  telegram_channel = 'https://t.me/kgoryachev'
  github = 'https://github.com/kevin-glare'
  email = 'kevinglare@yandex.ru'
  ogImage = '/images/base/og-cover.png'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'github'

[caches]
  [caches.assets]
    dir = ':resourceDir/_gen'
    maxAge = -1
  [caches.images]
    dir = ':resourceDir/_gen'
    maxAge = -1

# Обложки доступны и как assets (resources.Get для srcset-вариантов),
# и как static (оригиналы для og:image) — один источник файлов
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
